name: Portfolio integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned official release

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate asset cache-busting version
        run: python tools/bump_assets.py --check

      - name: Validate static site
        run: python tools/validate_site.py

      - name: Validate recruiter-facing surface
        run: python tools/validate_hiring_surface.py

      - name: Validate JavaScript syntax
        run: |
          for f in assets/js/*.js assets/js/labs/*.js; do
            node --check "$f"
          done

      - name: Validate local search index
        run: python -m json.tool assets/data/search-index.json > /dev/null

      - name: Validate generated-asset scripts compile
        run: |
          python -m py_compile assets/hero/generate.py
          python -m py_compile assets/diagrams/generate.py
