<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{width:1200px;height:630px;overflow:hidden}
body{width:1200px;height:630px;background:#07090D;overflow:hidden;position:relative;
  font-family:Inter,sans-serif;color:#E7ECF3}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:60px 60px}
.glow{position:absolute;width:900px;height:900px;right:-260px;top:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(43,127,255,.20),transparent 62%)}
svg.orb{position:absolute;right:-120px;top:50%;transform:translateY(-50%);opacity:.55}
.wrap{position:absolute;inset:0;padding:74px 78px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.16em;color:#616E82}
.mark{width:44px;height:44px;border:1.5px solid #2B7FFF;color:#2B7FFF;display:grid;place-items:center;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;background:rgba(43,127,255,.1)}
h1{font-family:'Space Grotesk',sans-serif;font-size:82px;font-weight:600;letter-spacing:-.028em;line-height:1.02}
.spec{font-family:'JetBrains Mono',monospace;font-size:19px;color:#22D3EE;letter-spacing:.05em;margin-top:22px;line-height:1.7}
.spec b{color:#98A4B6;font-weight:400}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.1em;color:#414C5C}
.chips{display:flex;gap:10px;margin-top:30px}
.chip{font-family:'JetBrains Mono',monospace;font-size:15px;color:#98A4B6;border:1px solid #28313F;padding:7px 13px;background:#0B0E14}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#2B7FFF,#22D3EE 55%,#FF7A18)}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<svg class="orb" width="760" height="760" viewBox="0 0 600 600" fill="none">
  <ellipse cx="300" cy="300" rx="280" ry="105" stroke="#28313F" transform="rotate(-22 300 300)"/>
  <ellipse cx="300" cy="300" rx="280" ry="105" stroke="#28313F" transform="rotate(34 300 300)"/>
  <circle cx="300" cy="300" r="205" stroke="#1A202B" stroke-dasharray="3 8"/>
  <circle cx="300" cy="300" r="285" stroke="#12171F"/>
  <circle cx="520" cy="240" r="7" fill="#22D3EE"/>
  <circle cx="120" cy="390" r="5" fill="#FF7A18"/>
</svg>
<div class="wrap">
  <div class="top"><div class="mark">VN</div><span>TEXAS A&amp;M UNIVERSITY &nbsp;//&nbsp; AEROSPACE ENGINEERING &nbsp;//&nbsp; MAY 2027</span></div>
  <div>
    <h1>Vinayak Manoj<br>Nair</h1>
    <div class="spec">GUIDANCE, NAVIGATION &amp; CONTROL &nbsp;<b>/</b>&nbsp; FLIGHT SOFTWARE<br>EMBEDDED SYSTEMS &nbsp;<b>/</b>&nbsp; AUTONOMOUS ROBOTICS</div>
    <div class="chips"><div class="chip">C++17</div><div class="chip">Python</div><div class="chip">ESKF</div><div class="chip">Monte Carlo</div><div class="chip">Abaqus FEA</div><div class="chip">HIL</div></div>
  </div>
  <div class="foot"><span>VINNAIR.ME</span><span>ENGINEERING CASE STUDIES</span></div>
</div>
<div class="bar"></div>
</body></html>
